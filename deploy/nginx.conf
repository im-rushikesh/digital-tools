# ==============================================================================
# Nginx Hardened Virtual Host Configuration
# Domain: adigitaltools.in & www.adigitaltools.in
# Server Root: /var/www/adigitaltools.in/current
# ==============================================================================

# Rate Limiting Zone for contact/enquiry endpoint
limit_req_zone $binary_remote_addr zone=contact_limit:10m rate=5r/m;
limit_req_status 429;

# 1. HTTP -> HTTPS Permanent Redirection (Port 80)
server {
    listen 80;
    listen [::]:80;
    server_name adigitaltools.in www.adigitaltools.in;

    # Allow Let's Encrypt ACME challenge before redirect
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/adigitaltools.in/current;
        allow all;
    }

    location / {
        return 301 https://adigitaltools.in$request_uri;
    }
}

# 2. HTTPS www -> Apex Redirection
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.adigitaltools.in;

    ssl_certificate /etc/letsencrypt/live/adigitaltools.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/adigitaltools.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    return 301 https://adigitaltools.in$request_uri;
}

# 3. Main Production Server (Apex https://adigitaltools.in)
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name adigitaltools.in;

    root /var/www/adigitaltools.in/current;
    index index.html;

    # Security & Information Disclosure
    server_tokens off;
    client_max_body_size 5M;

    # TLS Certificates (Certbot managed)
    ssl_certificate /etc/letsencrypt/live/adigitaltools.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/adigitaltools.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # --------------------------------------------------------------------------
    # Production Security Headers (A+ on securityheaders.com)
    # --------------------------------------------------------------------------
    # 1. HSTS (Strict-Transport-Security) - 2 years, preload ready
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # 2. Hardened Content-Security-Policy (CSP)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self'; frame-src https://www.youtube-nocookie.com https://www.youtube.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;

    # 3. Defensive Browser Protections
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # --------------------------------------------------------------------------
    # Compression: Gzip & Brotli (if installed)
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml font/woff2;

    # --------------------------------------------------------------------------
    # Static Assets Caching Rules
    # --------------------------------------------------------------------------
    # Immutable Long-Term Cache for hashed bundles, fonts, images
    location ~* \.(?:css|js|woff2|woff|ttf|png|jpg|jpeg|gif|ico|svg|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # No-cache for HTML files & JSON metadata to ensure immediate updates on deploy
    location ~* \.(?:html|json)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # Block access to hidden files (.git, .env, .htaccess, etc.)
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # RFC 9116 Security.txt
    location = /.well-known/security.txt {
        allow all;
        default_type text/plain;
    }

    # --------------------------------------------------------------------------
    # Rate-limited Contact / Enquiry Form Reverse Proxy Block
    # --------------------------------------------------------------------------
    location /api/enquiry {
        limit_req zone=contact_limit burst=5 nodelay;
        client_max_body_size 1M;
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Custom 404 handler
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Default fallback routing
    location / {
        try_files $uri $uri/ /index.html =404;
    }
}