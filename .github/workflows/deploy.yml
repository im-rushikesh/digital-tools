name: Production Deployment Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production_deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build & Validate
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Security Audit
        run: npm audit --audit-level=high

      - name: Build Static Site
        run: npm run build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist/
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: Deploy to CloudPanel VPS
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: production
      url: https://adigitaltools.in
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: dist

      - name: Setup SSH Deploy Key & Known Hosts
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Upload Release & Update CloudPanel Live Directory
        env:
          HOST: ${{ secrets.SSH_HOST }}
          USER: ${{ secrets.SSH_USER }}
          PORT: ${{ secrets.SSH_PORT || '22' }}
          SHA: ${{ github.sha }}
        run: |
          echo "[+] Syncing build files to /home/adigitaltools/htdocs/adigitaltools.in..."
          
          rsync -avz --delete \
            -e "ssh -p ${PORT} -i ~/.ssh/deploy_key" \
            dist/ ${USER}@${HOST}:/home/adigitaltools/htdocs/adigitaltools.in/

      - name: Live Endpoint Health Verification
        run: |
          echo "[+] Verifying public HTTPS response..."
          sleep 2
          curl -f -s -I -A "GitHubActions-HealthCheck" https://adigitaltools.in | head -n 5